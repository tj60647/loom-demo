# DOES PRODUCTION STILL REACH ITS DATABASE?
#
# Written because on 2026-09-01 it stopped, and nothing noticed for about ten
# hours. The Neon owner role's password rotated at 16:37:52Z — a side effect of
# attaching that Neon store to another Vercel project — and production's
# DATABASE_URL, which is set by hand and not managed by the integration, kept
# the old one. Every NextAuth adapter call failed, so no student could sign in.
#
# THE HOMEPAGE STAYED 200 THE WHOLE TIME. Next.js renders those pages without
# data, so any check pointed at `/` saw a healthy site. The outage ended when a
# person complained, which is not a monitoring strategy.
#
# `/api/health` exists for exactly this question and answers only it: 200
# {"ok":true} when a `select 1` reaches the database, 503 when it does not.
#
# It replaced `/api/sources` here, which worked but for the wrong reason. The
# outage surfaced on `/reading/[sourceId]` — 29 5xx that day against 7 on
# `/api/sources`, and all seven of those were a person running curl during the
# diagnosis. Asking a route real users happen to hit ties this check to a data
# shape that may change; `/api/health` has no payload to drift.
#
# TWO LIMITS OF DOING THIS HERE, both real:
#   - GitHub delays scheduled workflows under load; treat the interval as a
#     ceiling on detection, not a guarantee.
#   - Scheduled workflows are disabled automatically after 60 days without
#     repository activity. On a repo that goes quiet, this stops silently.
# An external uptime service has neither limit and needs no access to Vercel
# or Neon. This is the version that lives with the code; it is not the best
# possible monitor, it is the one that costs nothing to keep.

name: heartbeat

on:
  schedule:
    # Every 15 minutes. The failure this catches lasted ten hours.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# A run already in flight answers the same question as a new one.
concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  database:
    name: production can reach its database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        env:
          # THE HOSTNAME IS PART OF THE CHECK, not an address for it.
          #
          # Four hostnames answer for this project. Measured over 30 Aug - 2 Sep,
          # students arrive on loom.aroughidea.com: 27,608 requests against 145
          # on loom.tjmcleish.com, and most of those 145 were one person running
          # curl during an incident.
          #
          # They resolve to the same deployment today, which is exactly why
          # picking the wrong one is dangerous rather than merely untidy: if the
          # hostname students use breaks while another still answers, a monitor
          # on the other one reports green through a total outage. That is the
          # failure this workflow exists to catch, so it must ask on the door
          # students actually walk through.
          URL: https://loom.aroughidea.com/api/health
        run: |
          set -uo pipefail

          # Neon scales the compute to zero when idle, so the first request
          # after a quiet stretch pays a cold start. Three attempts with a
          # generous timeout keeps that from reading as an outage.
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/body 2>/dev/null; then
              echo "ok — attempt $attempt returned 200 {\"ok\":true}"
              exit 0
            fi
            echo "attempt $attempt: status $code"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo
          echo "PRODUCTION CANNOT REACH ITS DATABASE."
          echo "  last status: $code"
          echo "  body (first 300 bytes):"
          head -c 300 /tmp/body || true
          echo
          echo
          echo "503 {\"ok\":false} is the signature of a stale DATABASE_URL: the site"
          echo "will still serve pages, and sign-in will not work. What to do is in"
          echo "docs/build-and-test-workflow.md. A 000 means the request never"
          echo "completed at all — check the domain and the deployment first."
          exit 1
