# The gate: nothing merges to master without these two jobs green plus a
# project-owner review (branch protection enforces both). Kept deliberately
# small — one file, two jobs, no bureaucracy.
#
# `checks` needs no secrets and runs everywhere, including forks.
# `e2e` needs the CI database and blob secrets (docs/deployments.md §CI);
# it fails loudly, not silently, when they are missing — a suite that
# quietly skips is not a gate.
#
# THE TWO JOBS ARE TRIGGERED DIFFERENTLY, ON PURPOSE (2026-08-19), because
# they cost differently. `checks` needs no database and takes about 90
# seconds, so it runs on every push to `dev` — that is the feedback a working
# branch actually wants between one change and the next. `e2e` holds a global
# lock (one CI database, one demo account — see its `concurrency` block), so a
# run is a turn taken from every other open PR, not just runner minutes; it
# stays on pull requests and on pushes to `master`, the tree that ships.
#
# The rule this replaces was `push` on master only, reasoning that a push to
# `dev` is "a tree the PR run already tested". That held while `dev` always
# arrived through a PR. It stopped holding: on 2026-08-19 the branch was 298
# commits past `master` with none of them ever seen by CI, and the first run
# found a break that had been sitting there a day — an ambiguous test locator
# that no local run reproduces, because it depends on fixture state. Cheap
# feedback on every push is what would have caught it the day it landed.
#
# Why the scope step exists rather than `paths-ignore`: e2e is a REQUIRED
# check. A job filtered away at the `on:` level never reports, so its check
# sits pending forever and the docs-only PR you meant to speed up is the one
# that cannot merge. The job therefore always runs and always reports — it
# decides *inside* whether the suite has anything to observe.

name: ci

on:
  pull_request:
    branches: [master, dev]
  push:
    # dev included since 2026-08-19 — see the note above. `checks` runs on
    # both; `e2e` decides inside whether a dev push is its business.
    branches: [master, dev]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # next build evaluates src/db at import; the driver only validates the
      # URL shape unless something queries, and nothing does at build time.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@ci.invalid/ci' }}
      # Read-only, and only used by the migration drift check below. Absent,
      # that check skips rather than fails — see scripts/check-prod-migrations.ts.
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      NEXTAUTH_SECRET: ci-build-only
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ci-dummy
      GITHUB_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: package.json declares `engines: node >= 22.7.0`, and
          # nothing enforces that — `npm ci` ignores engines unless strict, so
          # CI ran an unsupported runtime for weeks without saying a word. See
          # the e2e job for what it actually cost.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check   # eslint + tsc
      # IS PRODUCTION'S SCHEMA READY FOR THE CODE ABOUT TO SHIP TO IT?
      #
      # Only on the way into master, because that is the merge that reaches
      # production. Migration 0028 sat applied-on-dev and unapplied-on-prod for
      # two days on 2026-08-23, and surfaced as every /admin page throwing
      # "column section.leadUserId does not exist" AFTER the merge. This asks
      # before it. Skips (green) with no PROD_DATABASE_URL secret configured.
      - name: Production migration drift
        if: github.base_ref == 'master' || github.ref_name == 'master'
        run: npm run check:prodmigrations
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One CI database, one shared demo account — two runs at once would corrupt
    # each other. Queue instead of overlapping.
    concurrency:
      group: loom-e2e
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.CI_BLOB_READ_WRITE_TOKEN }}
      NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET || 'ci-e2e-secret' }}
      # Protocol included — its absence (not the port) is the classic breakage.
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ci-dummy      # OAuth is never exercised: the suite enters
      GITHUB_SECRET: ci-dummy  # through /api/auth/test-login (dev-mode only).
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope step diffs against the PR base, which shallow history
          # does not contain.
          fetch-depth: 0
      - name: Scope — does this diff touch anything the suite can see?
        id: scope
        run: |
          # Pushes to master always run: that is the tree that ships, and a
          # merge can combine two individually-harmless diffs.
          #
          # Pushes to dev do NOT. `checks` has already covered that push in
          # about 90 seconds, and running the suite here would take the shared
          # database's turn from every open PR on every commit — the cost the
          # trigger note above weighs. The gate for dev is a pull request, and
          # a standing draft one is enough to get it whenever it is wanted.
          #
          # Decided HERE rather than with an `if:` on the job, for the same
          # reason this step exists at all: e2e is a required check, and a job
          # filtered away never reports.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "push to master — running the full suite" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              {
                echo "### e2e skipped — branch push"
                echo '`checks` covers a push to a working branch; the suite runs'
                echo 'on pull requests and on pushes to `master`. See the trigger'
                echo 'note in ci.yml.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # Everything NOT in the prose-only set. No spec can observe docs,
          # markdown, or editor/agent config; every other path is code, data,
          # migration, dependency or CI wiring and is fair game.
          CODE=$(printf '%s\n' "$CHANGED" \
            | grep -vE '^(docs/|\.claude/|\.vscode/)|(^|/)[^/]*\.md$|^LICENSE' \
            || true)
          if [ -z "$CODE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### e2e skipped — prose-only diff"
              echo "No spec can observe these paths:"
              printf '%s\n' "$CHANGED" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            {
              echo "### e2e running — code paths changed"
              printf '%s\n' "$CODE" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Require CI secrets
        if: steps.scope.outputs.run == 'true'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::CI_DATABASE_URL is not set. The e2e gate cannot run — see docs/deployments.md §CI for the secrets to configure."
            exit 1
          fi
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::CI_BLOB_READ_WRITE_TOKEN is not set. The e2e gate cannot run — see docs/deployments.md §CI for the secrets to configure."
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          # THE RUNTIME IS PART OF THE TEST. pdf.js decodes scan images through
          # `openjpeg_nowasm_fallback.js` — ESM with a .js extension in a
          # package with no `"type": "module"` — which needs Node's module-syntax
          # detection, i.e. >= 22.7. On 20 it fails as `buffer
          # .transferToFixedLength is not a function` and every server-rendered
          # scan comes back BLANK, with a warning and no error. That silently
          # failed four specs here (library-verify, sandbox, practice-guide ×2)
          # while the code under them was fine.
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.run == 'true'
      # WebKit as well as Chromium since 2026-08-23: the `tablet` project runs
      # Safari's engine at an iPad, which is the only thing in this suite that
      # can answer a question about Safari. ~59MB, downloaded once per run.
      - run: npx playwright install --with-deps chromium webkit
        if: steps.scope.outputs.run == 'true'
      - name: Migrate CI database
        if: steps.scope.outputs.run == 'true'
        run: npx drizzle-kit migrate
      - name: Seed readings and demo accounts
        if: steps.scope.outputs.run == 'true'
        run: |
          npm run seed:sources
          npm run seed:demo
      - name: Run the suite
        if: steps.scope.outputs.run == 'true'
        # The default config: starts `next dev` itself (test-login needs a
        # non-production build), port 3000, one worker.
        #
        # Smoke on the way in, everything on the way to master. The suite runs
        # single-worker (playwright.config.ts: every spec shares Test User A
        # and the capture specs delete their own rows), so 22 spec files take
        # 16–22 minutes — a long wait to hear about a typo. A PR into `dev`
        # therefore runs the four specs that fail first when something is
        # actually broken:
        #   access          — the authorization boundary
        #   journey-learner — the student's whole path, end to end
        #   cloth           — capture, the object everything else is built on
        #   pdf-fit         — the viewer, and with it the Node/pdf.js decode
        #                     path that once blanked every scan in silence
        # `master` — the tree that ships, and the one branch protection gates
        # — still runs all 22. Nothing reaches production on the subset.
        #
        # This list is the honest cost: a spec outside it can break on a `dev`
        # PR and only be caught at the master gate. Add to it when a class of
        # breakage escapes; that is a cheaper repair than an unread 20-minute
        # check.
        #
        # The full run goes in two passes, because one worker was never about
        # the browser — it was the shared Test User A account. The `read`
        # project (playwright.config.ts) is the twelve specs that write
        # nothing, so they cannot race each other. The `write` project keeps
        # the single worker that is the only mutex the suite has.
        #
        # Two, not four. Measured on the read project, warm local cache:
        #   1 worker  — 3.0 min, 35 passed
        #   2 workers — 1.6 min, 35 passed
        #   4 workers — 1.3 min, 34 passed, 1 FAILED
        # The four-worker failure was object-download's practice-loom entry
        # timing out on a hydration-dependent click — not a data conflict, and
        # not an assertion coming out wrong. That is the Next DEV SERVER, not
        # the database: one process compiling routes on demand cannot feed
        # four browsers. Six-tenths of a minute is not worth buying a flake
        # that will be blamed on the app.
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "master" ]; then
            echo "### e2e — full suite (master), two passes" >> "$GITHUB_STEP_SUMMARY"
            npx playwright test --project=read --workers=2
            npx playwright test --project=write
            # Safari at an iPad. Its own pass, so a WebKit-only failure reads
            # as one rather than being blamed on the desktop suite.
            npx playwright test --project=tablet
          else
            echo "### e2e — smoke subset (dev)" >> "$GITHUB_STEP_SUMMARY"
            echo "Full 22-spec suite runs on the PR into \`master\`." >> "$GITHUB_STEP_SUMMARY"
            npx playwright test \
              tests/access.spec.ts \
              tests/journey-learner.spec.ts \
              tests/cloth.spec.ts \
              tests/pdf-fit.spec.ts
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
