# The gate: nothing merges to master without these two jobs green plus a
# project-owner review (branch protection enforces both). Kept deliberately
# small — one file, two jobs, no bureaucracy.
#
# `checks` needs no secrets and runs everywhere, including forks.
# `e2e` needs the CI database and blob secrets (docs/deployments.md §CI);
# it fails loudly, not silently, when they are missing — a suite that
# quietly skips is not a gate.

name: ci

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # next build evaluates src/db at import; the driver only validates the
      # URL shape unless something queries, and nothing does at build time.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@ci.invalid/ci' }}
      NEXTAUTH_SECRET: ci-build-only
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ci-dummy
      GITHUB_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check   # eslint + tsc
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One CI database, one shared demo account — two runs at once would corrupt
    # each other. Queue instead of overlapping.
    concurrency:
      group: loom-e2e
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.CI_BLOB_READ_WRITE_TOKEN }}
      NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET || 'ci-e2e-secret' }}
      # Protocol included — its absence (not the port) is the classic breakage.
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ci-dummy      # OAuth is never exercised: the suite enters
      GITHUB_SECRET: ci-dummy  # through /api/auth/test-login (dev-mode only).
    steps:
      - uses: actions/checkout@v4
      - name: Require CI secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::CI_DATABASE_URL is not set. The e2e gate cannot run — see docs/deployments.md §CI for the secrets to configure."
            exit 1
          fi
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::CI_BLOB_READ_WRITE_TOKEN is not set. The e2e gate cannot run — see docs/deployments.md §CI for the secrets to configure."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Migrate CI database
        run: npx drizzle-kit migrate
      - name: Seed readings and demo accounts
        run: |
          npm run seed:sources
          npm run seed:demo
      - name: Run the suite
        # The default config: starts `next dev` itself (test-login needs a
        # non-production build), port 3000, one worker.
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
